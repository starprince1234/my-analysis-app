# /my-analysis-app/docker-compose.yml

version: '3.8'

services:
  # 后端Flask服务
  backend:
    build: 
      context: ./backend
    container_name: analysis_backend
    env_file:
      - .env
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      UPLOAD_FOLDER: ${UPLOAD_FOLDER:-uploads}
      RESULT_FOLDER: ${RESULT_FOLDER:-results}
      MAX_CONTENT_LENGTH_MB: ${MAX_CONTENT_LENGTH_MB:-50}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    # 使用 Gunicorn 启动应用，开启 3 个工作进程。eventlet 用于支持 SocketIO。
    command: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:5000 app:app
    volumes:
      # 将本地 backend 目录挂载到容器的 /app 目录，方便代码热更新
      - ./backend:/app
    expose:
      # 只在内部网络暴露 5000 端口
      - 5000

  # 前端 Nginx 服务
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile # 指定 Dockerfile 的路径
    container_name: analysis_nginx
    ports:
      # 将外部的 80 端口映射到容器的 80 端口，这样你就可以通过 localhost 访问
      - "80:80"
    volumes:
      # 将本地 frontend 目录挂载到 Nginx 的静态文件服务目录
      - ./frontend:/usr/share/nginx/html
      # 将后端生成的 results 目录挂载到 Nginx，让 Nginx 直接提供结果文件访问（只读）
      - ./backend/results:/app/results:ro
    depends_on:
      # 确保 backend 服务先于 nginx 启动
      - backend
